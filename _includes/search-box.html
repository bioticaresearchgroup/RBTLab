{% comment %}
  INLINE PAGE SEARCH BOX
  Text input that filters elements on the page via onSearchInput /
  onSearchClear (defined in _scripts/search.js) and mark.js for
  highlighting. The clear button starts disabled.
{% endcomment %}
<div class="search-box">
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="Search items on this page"
  />
  <button
    disabled
    data-tooltip="Clear search"
    aria-label="clear search"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
