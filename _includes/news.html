{{ " " }}
<div class="news-list">
  {% assign news = site.data.news
    | default: ""
    | sort: "date"
    | reverse
    | slice: 0, 4
  %}
  {% for item in news %}
    <div class="news-item">
      <span class="news-date">{{ item.date | date: "%d %b %Y" }}</span>
      <div class="news-body">
        <a
          {% if item.url %}
            href="{{ item.url }}"
          {% endif %}
          class="news-title"
        >
          {{ item.title }}
        </a>
        <p class="news-description">
          {{ item.description | markdownify | remove: "<p>" | remove: "</p>" }}
        </p>
      </div>
    </div>
  {% endfor %}
</div>
