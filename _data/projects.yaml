- title: Early Osteogenic, X-ray visible, and 3D Printable Fixators for diabetic Orthopedic and Craniomaxillofacial repair with Tunable Biodegradability, Modulus and High Bone Regenerative Index
  subtitle: 2026-2029
  group: featured
  image: images/project1.png
  link: 
  description: Development of early-osteogenic, intrinsically radiopaque bone fixators engineered for diabetic orthopedic and craniomaxillofacial repair. The fixatives couple tunable biodegradability and mechanical modulus with a high bone-regenerative index, and are processable by 3D printing for patient-matched geometries.
  funders:
    - AICTE
  tags:
    - orthopedic
    - osteogenesis
    - 3d-printing
    - radiopaque
    - ongoing

